name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SuperTube.apk

      - name: Guardar APK no build
        uses: actions/upload-artifact@v4
        with:
          name: SuperTube-apk
          path: SuperTube.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SuperTube build ${{ github.run_number }}
          make_latest: true
          body: |
            Baixe o arquivo **SuperTube.apk** abaixo e instale no Android.
            Commit: ${{ github.sha }}
          files: SuperTube.apk
