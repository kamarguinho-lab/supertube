name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Certificado do app
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Tira espaços e quebras de linha que entram ao colar o texto
            printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r\t' > /tmp/ks.b64
            echo "Tamanho do texto: $(wc -c < /tmp/ks.b64) (o certo é 5824)"
            base64 -d -i /tmp/ks.b64 > app/release.jks
            keytool -list -keystore app/release.jks -storepass "$KEYSTORE_PASS" | grep -i "supertube" \
              && echo "Usando o certificado próprio"
          else
            echo "Sem certificado próprio: usando o antigo"
          fi

      - name: Compilar APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assemblePhoneRelease assembleTvRelease

      - name: Renomear APKs (com a versão no nome)
        run: |
          V="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/phone/release/app-phone-release.apk "SuperTube-$V.apk"
          cp app/build/outputs/apk/tv/release/app-tv-release.apk "SuperTube-TV-$V.apk"
          # Nomes antigos: o botão Atualizar das versões já instaladas procura por eles
          cp "SuperTube-$V.apk" SuperTube.apk
          cp "SuperTube-TV-$V.apk" SuperTube-TV.apk

      - name: Guardar APK no build
        uses: actions/upload-artifact@v4
        with:
          name: SuperTube-apks
          path: |
            SuperTube-1.0.*.apk
            SuperTube-TV-1.0.*.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SuperTube 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            - **SuperTube-1.0.${{ github.run_number }}.apk**: para celular
            - **SuperTube-TV-1.0.${{ github.run_number }}.apk**: para Android TV / Google TV
            Commit: ${{ github.sha }}
          files: |
            SuperTube-1.0.${{ github.run_number }}.apk
            SuperTube-TV-1.0.${{ github.run_number }}.apk
            SuperTube.apk
            SuperTube-TV.apk
