name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assemblePhoneDebug assembleTvDebug

      - name: Renomear APKs
        run: |
          cp app/build/outputs/apk/phone/debug/app-phone-debug.apk SuperTube.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk SuperTube-TV.apk

      - name: Guardar APK no build
        uses: actions/upload-artifact@v4
        with:
          name: SuperTube-apks
          path: |
            SuperTube.apk
            SuperTube-TV.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SuperTube build ${{ github.run_number }}
          make_latest: true
          body: |
            - **SuperTube.apk**: para celular
            - **SuperTube-TV.apk**: para Android TV / Google TV
            Commit: ${{ github.sha }}
          files: |
            SuperTube.apk
            SuperTube-TV.apk
