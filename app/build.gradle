plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kamarguinho.supertube'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kamarguinho.supertube'
        minSdk 24
        targetSdk 35
        // O número do build do GitHub Actions vira a versão (usado pelo botão Atualizar)
        def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode build
        versionName "1.0.${build}"
        buildConfigField 'String', 'UPDATE_REPO', '"kamarguinho-lab/supertube"'
        // Projeto Firebase da conta SuperTube (ficam em gradle.properties)
        buildConfigField 'String', 'FIREBASE_API_KEY',
                "\"${project.findProperty('firebaseApiKey') ?: ''}\""
        buildConfigField 'String', 'FIREBASE_DB_URL',
                "\"${project.findProperty('firebaseDbUrl') ?: ''}\""
    }

    // Chave fixa para que cada APK novo instale por cima do antigo
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // Dois APKs: um para celular e outro só para TV
    flavorDimensions 'device'
    productFlavors {
        phone {
            dimension 'device'
        }
        tv {
            dimension 'device'
            applicationIdSuffix '.tv'
            versionNameSuffix '-tv'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/README.md', 'META-INF/CHANGES', 'META-INF/COPYRIGHT',
                         'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'

    // Mesma biblioteca que o NewPipe usa para ler YouTube, PeerTube, SoundCloud etc.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Player (mesma versão do NewPipe)
    def exo = '2.19.1'
    implementation "com.google.android.exoplayer:exoplayer-core:$exo"
    implementation "com.google.android.exoplayer:exoplayer-dash:$exo"
    implementation "com.google.android.exoplayer:exoplayer-hls:$exo"
    implementation "com.google.android.exoplayer:exoplayer-ui:$exo"
    implementation "com.google.android.exoplayer:extension-mediasession:$exo"
    implementation 'com.google.guava:guava:33.3.1-android'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation 'androidx.activity:activity:1.9.3'

    // Login com a conta Google (só no celular, para importar inscrições e curtidos)
    phoneImplementation 'com.google.android.gms:play-services-auth:21.2.0'
}
